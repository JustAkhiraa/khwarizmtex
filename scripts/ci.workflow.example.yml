name: Validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:package
      - run: node scripts/build-online.mjs
      - uses: actions/upload-artifact@v4
        if: matrix.node == 22
        with:
          name: online-static
          path: build/online/
      - uses: actions/upload-artifact@v4
        if: matrix.node == 22
        with:
          name: dist
          path: dist/
  runtime:
    name: Bibliothèque Node ${{ matrix.node }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: node scripts/check-package.mjs
  browsers:
    name: Chromium, Firefox, WebKit et mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-navigateurs
          path: playwright-report/
